name: CP1 — Repository Setup Grader

on:
  issues:
    types: [opened, edited, reopened]
  issue_comment:
    types: [created, edited]

permissions:
  contents: read
  issues: write

jobs:
  grade:
    if: ${{ !github.event.issue.pull_request && contains(github.event.issue.body, '### Practice Repository URL') }}
    runs-on: ubuntu-latest

    steps:
      - name: Check out trusted grader code
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Grade CP1 submission
        uses: actions/github-script@v7
        with:
          script: |
            const { evaluateSubmission, parseRepoUrl } = require('./.github/scripts/cp1-utils');
            const { owner, repo } = context.repo;
            const issue = context.payload.issue;
            const issueNumber = issue.number;
            const student = issue.user.login;
            const marker = '<!-- klis-cp1-score -->';
            const allowedGraders = new Set(['hbycwyh2008']);

            async function publicJson(url) {
              const r = await fetch(url, {
                headers: {
                  'Accept': 'application/vnd.github+json',
                  'User-Agent': 'KLIS-CS-CP1-Grader'
                }
              });
              if (r.status === 403 || r.status === 429) {
                throw new Error('GitHub public API rate limit reached. Re-run the grader later; this is not a student error.');
              }
              if (r.status === 404) return null;
              if (!r.ok) throw new Error(`GitHub API returned ${r.status} for ${url}`);
              return await r.json();
            }

            async function publicText(url) {
              const r = await fetch(url, {
                headers: { 'User-Agent': 'KLIS-CS-CP1-Grader' }
              });
              if (r.status === 404) return '';
              if (!r.ok) throw new Error(`Unable to read repository file (${r.status}).`);
              return await r.text();
            }

            function parseManualGrade(body) {
              if (!body) return null;

              const legacy = body.match(/(?:^|\n)\s*\/manual-grade\s+(40|[0-3]?\d)(?:\s|$)/i);
              if (legacy) {
                return {
                  score: Number(legacy[1]),
                  breakdown: null,
                  format: 'short'
                };
              }

              if (!/(?:^|\n)\s*\/manual-grade\s*(?:\n|$)/i.test(body)) return null;

              const readTen = label => {
                const escaped = label.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
                const m = body.match(new RegExp(`^\\s*${escaped}:\\s*(10|[0-9])\\s*\\/\\s*10\\s*$`, 'mi'));
                return m ? Number(m[1]) : null;
              };

              const breakdown = {
                readme: readTen('README'),
                gitignore: readTen('.gitignore'),
                license: readTen('LICENSE'),
                reasoning: readTen('Reasoning')
              };

              if (Object.values(breakdown).some(v => v === null)) return null;

              return {
                score: breakdown.readme + breakdown.gitignore + breakdown.license + breakdown.reasoning,
                breakdown,
                format: 'template'
              };
            }

            const repoUrlMatch = issue.body?.match(/### Practice Repository URL\s*\n+([^\n]+)/i);
            const repositoryUrl = repoUrlMatch?.[1]?.trim() || '';
            const parsed = parseRepoUrl(repositoryUrl);

            let meta = null;
            let readme = '';
            let gitignore = '';
            let license = '';
            let commitCount = 0;

            if (parsed) {
              const encodedOwner = encodeURIComponent(parsed.owner);
              const encodedRepo = encodeURIComponent(parsed.repo);
              meta = await publicJson(`https://api.github.com/repos/${encodedOwner}/${encodedRepo}`);
              if (meta && meta.private === false) {
                const branch = encodeURIComponent(meta.default_branch || 'main');
                const base = `https://raw.githubusercontent.com/${encodedOwner}/${encodedRepo}/${branch}`;
                const commits = await publicJson(`https://api.github.com/repos/${encodedOwner}/${encodedRepo}/commits?per_page=3`);
                commitCount = Array.isArray(commits) ? commits.length : 0;
                [readme, gitignore, license] = await Promise.all([
                  publicText(`${base}/README.md`),
                  publicText(`${base}/.gitignore`),
                  publicText(`${base}/LICENSE`)
                ]);
              }
            }

            const result = evaluateSubmission({
              meta,
              readme,
              gitignore,
              license,
              commitCount,
              issueBody: issue.body || '',
              student
            });

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number: issueNumber, per_page: 100
            });

            let manual = null;
            for (const c of [...comments].sort((a,b) => new Date(b.updated_at) - new Date(a.updated_at))) {
              if (!allowedGraders.has(c.user?.login?.toLowerCase())) continue;
              const parsedGrade = parseManualGrade(c.body || '');
              if (parsedGrade) {
                manual = { ...parsedGrade, grader: c.user.login };
                break;
              }
            }

            const teacher = manual?.score ?? 0;
            const total = result.automatic + teacher;
            const rows = result.checks.map(([label, earned, max, detail]) =>
              `| ${earned === max ? '✅' : earned ? '🟨' : '⬜'} ${label} | ${earned}/${max} | ${detail} |`
            ).join('\n');

            const status = result.automatic < 60
              ? '🟡 **IN PROGRESS — fix the repository or submission, then edit this Issue to re-grade.**'
              : !manual
                ? '🔵 **AUTOMATIC CHECKS PASSED — awaiting teacher review.**'
                : `✅ **FINAL SCORE: ${total}/100**`;

            const integrityNote = result.integrityConfirmed
              ? 'Integrity check confirmed in the submission form.'
              : 'Integrity checkbox evidence was not detected; teacher should verify authorship.';

            const breakdownText = manual?.breakdown
              ? `README ${manual.breakdown.readme}/10 · .gitignore ${manual.breakdown.gitignore}/10 · LICENSE ${manual.breakdown.license}/10 · Reasoning ${manual.breakdown.reasoning}/10`
              : manual
                ? 'Teacher used the short-form manual score.'
                : 'Not graded yet.';

            const teacherTemplate = [
              '```text',
              '/manual-grade',
              'README: 0/10',
              '.gitignore: 0/10',
              'LICENSE: 0/10',
              'Reasoning: 0/10',
              '',
              'Feedback:',
              'Write concise feedback here.',
              '```'
            ].join('\n');

            const scoreBody = `${marker}
            ## CP1 Automatic Check

            **Student:** @${student}  
            **Practice repository:** ${result.repositoryUrl || 'not provided'}  
            **Automatic score:** ${result.automatic}/60  
            **Teacher score:** ${manual ? `${teacher}/40 by @${manual.grader}` : 'awaiting review'}  
            **Current total:** ${total}/100

            | Check | Score | Evidence |
            |---|---:|---|
            ${rows}
            | 🧑‍🏫 Teacher review | ${manual ? `${teacher}/40` : '—/40'} | ${manual ? `graded by @${manual.grader}` : 'awaiting review'} |

            ${status}

            > ${integrityNote}

            ### 🧑‍🏫 Teacher grading

            **Current teacher breakdown:** ${breakdownText}

            Copy the fixed template below into a **new comment**, replace the four scores, and add feedback. The workflow will calculate the teacher subtotal automatically.

            ${teacherTemplate}

            **How to improve the automatic score:** make changes in the practice repository, then edit this submission Issue (even a small edit) to run the grader again.
            `;

            const existing = comments.find(c => c.user?.type === 'Bot' && c.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body: scoreBody });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number: issueNumber, body: scoreBody });
            }

            await core.summary
              .addHeading(`CP1: ${total}/100`)
              .addRaw(`Automatic: ${result.automatic}/60\n`)
              .addRaw(`Teacher: ${manual ? `${teacher}/40` : 'awaiting review'}\n`)
              .write();
