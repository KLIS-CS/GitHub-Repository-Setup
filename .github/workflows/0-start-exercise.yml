name: Start Exercise

on:
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  start:
    runs-on: ubuntu-latest
    steps:
      - name: Create checkpoint issue
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const marker = '<!-- klis-cp1-exercise -->';
            const username = context.actor;
            const branch = `cp1-${username}`;

            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: 'all', per_page: 100
            });
            const existing = issues.find(i => !i.pull_request && i.body?.includes(marker));
            if (existing) {
              core.info(`Exercise issue already exists: #${existing.number}`);
              return;
            }

            const body = `${marker}
            ## Checkpoint 1 — Repository Setup

            Welcome @${username}.

            **Required branch:** \`${branch}\`

            ### Your task
            1. Read the repository README.
            2. Create the required branch locally from \`main\`.
            3. Create \`project/README.md\`, \`project/.gitignore\`, and \`project/LICENSE\`.
            4. Complete \`submission.md\`.
            5. Commit, push, and open a Pull Request to \`main\`.
            6. Leave the Pull Request open for teacher review.

            Do not work directly on \`main\`.
            `;

            await github.rest.issues.create({
              owner, repo,
              title: 'Exercise: Checkpoint 1 — Repository Setup',
              body
            });
