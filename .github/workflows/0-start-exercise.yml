name: Start CP1

on:
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  start:
    if: ${{ github.repository != 'KLIS-CS/GitHub-Repository-Setup' }}
    runs-on: ubuntu-latest
    steps:
      - name: Create or refresh CP1 exercise issue
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const marker = '<!-- klis-cp1-exercise -->';
            const submitUrl = 'https://github.com/KLIS-CS/GitHub-Repository-Setup/issues/new?template=cp1-submission.yml';

            const body = `${marker}
            # CP1 — Repository Setup

            **Time target: 25 minutes**

            Your repository was copied from the official KLIS-CS CP1 template. Complete the actual repository setup yourself.

            ## Required work

            1. Clone this repository to your computer.
            2. Read \`CP1-TASK.md\`.
            3. Replace the starter \`README.md\` with your own project README.
            4. Create a real \`.gitignore\` with appropriate ignore rules.
            5. Add a complete open-source \`LICENSE\`.
            6. Commit and push your finished files to \`main\`.
            7. Submit the repository through the central CP1 submission form.

            ## Required repository name

            \`cp1-repository-setup-YOUR-GITHUB-USERNAME\`

            ## Submit

            [**SUBMIT CP1 →**](${submitUrl})

            Leave this Issue open while you work. The central submission Issue will contain the automatic score and teacher review.`;

            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: 'all', per_page: 100
            });
            const existing = issues.find(i => !i.pull_request && i.body?.includes(marker));

            if (existing) {
              await github.rest.issues.update({ owner, repo, issue_number: existing.number, state: 'open', body });
            } else {
              await github.rest.issues.create({ owner, repo, title: 'CP1 — Exercise Instructions', body });
            }
