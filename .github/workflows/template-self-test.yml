name: CP1 Template Self-Test

on:
  push:
    branches: [main]
    paths: ['README.md','submission.md','TEACHER-GRADING.md','.github/**']

permissions:
  contents: read

jobs:
  structural-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate CP1 template
        shell: bash
        run: |
          set -euo pipefail
          for f in README.md submission.md TEACHER-GRADING.md .github/pull_request_template.md .github/workflows/0-start-exercise.yml .github/workflows/grade.yml .github/workflows/guardrails.yml; do
            test -f "$f" || { echo "Missing $f"; exit 1; }
          done
          grep -q 'cp1-YOUR-GITHUB-USERNAME' README.md
          grep -q 'GitHub Username:' submission.md
          grep -q '/manual-grade' .github/workflows/grade.yml
          echo 'CP1 template structure is valid.'
