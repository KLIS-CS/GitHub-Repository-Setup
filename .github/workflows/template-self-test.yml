name: CP1 Assessment Self-Test

on:
  push:
    branches: [main]
    paths:
      - 'README.md'
      - 'CP1-TASK.md'
      - 'TEACHER-GRADING.md'
      - '.github/**'
      - 'tests/**'
  pull_request:
    branches: [main]
    paths:
      - 'README.md'
      - 'CP1-TASK.md'
      - 'TEACHER-GRADING.md'
      - '.github/**'
      - 'tests/**'

permissions:
  contents: read

jobs:
  assessment-self-test:
    if: ${{ github.repository == 'KLIS-CS/GitHub-Repository-Setup' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate CP1 assessment structure
        shell: bash
        run: |
          set -euo pipefail
          for f in \
            README.md \
            CP1-TASK.md \
            TEACHER-GRADING.md \
            .github/ISSUE_TEMPLATE/cp1-submission.yml \
            .github/ISSUE_TEMPLATE/config.yml \
            .github/workflows/grade.yml \
            .github/workflows/teacher-review-files.yml \
            .github/scripts/cp1-utils.js \
            tests/cp1-utils.test.js; do
            test -f "$f" || { echo "Missing $f"; exit 1; }
          done

          grep -q 'New repository' README.md
          grep -q 'at least two commits' README.md
          grep -q 'do not use a template' README.md
          grep -q 'Submit CP1' README.md
          grep -q 'New repository' CP1-TASK.md
          grep -q 'at least two commits' CP1-TASK.md
          grep -q 'Practice Repository URL' .github/ISSUE_TEMPLATE/cp1-submission.yml
          grep -q 'did not use a template or fork' .github/ISSUE_TEMPLATE/cp1-submission.yml
          grep -q '/manual-grade' .github/workflows/grade.yml
          grep -q 'Teacher grading' .github/workflows/grade.yml
          grep -q 'README: 0/10' .github/workflows/grade.yml
          grep -q '.gitignore: 0/10' .github/workflows/grade.yml
          grep -q 'LICENSE: 0/10' .github/workflows/grade.yml
          grep -q 'Reasoning: 0/10' .github/workflows/grade.yml
          grep -q 'Teacher Review Files' .github/workflows/teacher-review-files.yml
          grep -q '60 automatic' TEACHER-GRADING.md
          grep -q 'fixed grading template' TEACHER-GRADING.md

      - name: Validate workflow YAML syntax
        shell: bash
        run: |
          ruby -e "require 'psych'; Dir['.github/workflows/*.yml'].each { |f| Psych.parse_file(f) }"

      - name: Run grader fixture tests
        run: node tests/cp1-utils.test.js

      - name: Confirm create-and-modify CP1 contract
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'createdFromScratch' .github/scripts/cp1-utils.js
          grep -q 'hasModificationCommit' .github/scripts/cp1-utils.js
          grep -q 'commitCount' .github/scripts/cp1-utils.js
          echo 'CP1 create-and-modify contract is present.'
