name: CP1 Assessment Self-Test

on:
  push:
    branches: [main]
    paths:
      - '.github/**'
  pull_request:
    branches: [main]
    paths:
      - '.github/**'

permissions:
  contents: read

jobs:
  assessment-self-test:
    if: ${{ github.repository == 'KLIS-CS/GitHub-Repository-Setup' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate CP1 assessment structure
        shell: bash
        run: |
          set -euo pipefail
          for f in \
            .github/README.md \
            .github/admin/TEACHER-GRADING.md \
            .github/ISSUE_TEMPLATE/cp1-submission.yml \
            .github/ISSUE_TEMPLATE/config.yml \
            .github/workflows/grade.yml \
            .github/workflows/student-score.yml \
            .github/workflows/teacher-review-files.yml \
            .github/scripts/cp1-utils.js \
            .github/tests/cp1-utils.test.js; do
            test -f "$f" || { echo "Missing $f"; exit 1; }
          done

          grep -Fq 'CP1 — Score' .github/README.md
          grep -Fq 'work directly on `main`' .github/README.md
          grep -Fq 'README.md' .github/README.md
          grep -Fq '.gitignore' .github/README.md
          grep -Fq 'LICENSE' .github/README.md
          grep -Fq 'Submit CP1' .github/README.md

          grep -Fq 'mother-repository submission form' .github/ISSUE_TEMPLATE/cp1-submission.yml
          grep -Fq 'Practice Repository URL' .github/ISSUE_TEMPLATE/cp1-submission.yml

          grep -Fq "github.repository == 'KLIS-CS/GitHub-Repository-Setup'" .github/workflows/grade.yml
          grep -Fq '.cp1-grades/' .github/workflows/grade.yml
          grep -Fq "gradeBranch = 'grades'" .github/workflows/grade.yml
          grep -Fq '/manual-grade' .github/workflows/grade.yml
          grep -Fq 'README: 0/10' .github/workflows/grade.yml
          grep -Fq '.gitignore: 0/10' .github/workflows/grade.yml
          grep -Fq 'LICENSE: 0/10' .github/workflows/grade.yml
          grep -Fq 'Reasoning: 0/10' .github/workflows/grade.yml

          grep -Fq "github.repository != 'KLIS-CS/GitHub-Repository-Setup'" .github/workflows/student-score.yml
          grep -Fq 'CP1 — Score' .github/workflows/student-score.yml
          grep -Fq 'raw.githubusercontent.com/KLIS-CS/GitHub-Repository-Setup/grades' .github/workflows/student-score.yml
          grep -Fq 'workflow_dispatch' .github/workflows/student-score.yml
          grep -Fq 'schedule:' .github/workflows/student-score.yml

          grep -Fq 'evaluateRepository' .github/scripts/cp1-utils.js
          grep -Fq "officialTemplate = 'klis-cs/github-repository-setup'" .github/scripts/cp1-utils.js
          grep -Fq 'mainIsDefault' .github/scripts/cp1-utils.js

          grep -Fq 'Teacher Review Files' .github/workflows/teacher-review-files.yml
          grep -Fq 'README.md preview' .github/workflows/teacher-review-files.yml
          grep -Fq '.gitignore preview' .github/workflows/teacher-review-files.yml
          grep -Fq 'LICENSE preview' .github/workflows/teacher-review-files.yml

          grep -Fq 'grades branch' .github/admin/TEACHER-GRADING.md
          grep -Fq 'student repo pulls the teacher score' .github/admin/TEACHER-GRADING.md

      - name: Validate workflow YAML syntax
        shell: bash
        run: |
          ruby -e "require 'psych'; Dir['.github/workflows/*.yml'].each { |f| Psych.parse_file(f) }"

      - name: Run grader fixture tests
        run: node .github/tests/cp1-utils.test.js

      - name: Confirm one-repo architecture contract
        shell: bash
        run: |
          set -euo pipefail
          test ! -f README.md
          test ! -f CP1-TASK.md
          test ! -f TEACHER-GRADING.md
          test ! -d tests
          echo 'CP1 keeps student work at repository root and system/grading files under .github.'
