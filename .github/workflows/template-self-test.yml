name: CP1 Assessment Self-Test

on:
  push:
    branches: [main]
    paths:
      - 'README.md'
      - 'CP1-TASK.md'
      - 'TEACHER-GRADING.md'
      - '.github/**'
      - 'tests/**'
  pull_request:
    branches: [main]
    paths:
      - 'README.md'
      - 'CP1-TASK.md'
      - 'TEACHER-GRADING.md'
      - '.github/**'
      - 'tests/**'

permissions:
  contents: read

jobs:
  assessment-self-test:
    if: ${{ github.repository == 'KLIS-CS/GitHub-Repository-Setup' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate CP1 assessment structure
        shell: bash
        run: |
          set -euo pipefail
          for f in \
            README.md \
            CP1-TASK.md \
            TEACHER-GRADING.md \
            .github/ISSUE_TEMPLATE/cp1-submission.yml \
            .github/ISSUE_TEMPLATE/config.yml \
            .github/workflows/grade.yml \
            .github/workflows/teacher-review-files.yml \
            .github/scripts/cp1-utils.js \
            tests/cp1-utils.test.js; do
            test -f "$f" || { echo "Missing $f"; exit 1; }
          done

          grep -Fq 'GitHub → New repository' README.md
          grep -Fq 'do NOT copy this repository' README.md
          grep -Fq 'Submit CP1' README.md
          grep -Fq 'Create the repository yourself' CP1-TASK.md
          grep -Fqi 'clone the repository' CP1-TASK.md
          grep -Fq 'Practice Repository URL' .github/ISSUE_TEMPLATE/cp1-submission.yml
          grep -Fq 'did not fork or use a template' .github/ISSUE_TEMPLATE/cp1-submission.yml
          grep -Fq '/manual-grade' .github/workflows/grade.yml
          grep -Fq 'Teacher grading' .github/workflows/grade.yml
          grep -Fq 'README: 0/10' .github/workflows/grade.yml
          grep -Fq '.gitignore: 0/10' .github/workflows/grade.yml
          grep -Fq 'LICENSE: 0/10' .github/workflows/grade.yml
          grep -Fq 'Reasoning: 0/10' .github/workflows/grade.yml
          grep -Fq 'Teacher File Review Panel' .github/workflows/teacher-review-files.yml
          grep -Fq '60 automatic' TEACHER-GRADING.md
          grep -Fq 'fixed grading template' TEACHER-GRADING.md

      - name: Validate workflow YAML syntax
        shell: bash
        run: |
          ruby -e "require 'psych'; Dir['.github/workflows/*.yml'].each { |f| Psych.parse_file(f) }"

      - name: Run grader fixture tests
        run: node tests/cp1-utils.test.js

      - name: Confirm from-scratch CP1 contract
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'createdFromScratch' .github/scripts/cp1-utils.js
          grep -Fq 'template_repository' .github/scripts/cp1-utils.js
          grep -Fq 'hasModificationEvidence' .github/scripts/cp1-utils.js
          grep -Fq 'commitCount' .github/scripts/cp1-utils.js
          grep -Fq 'commits?per_page=3' .github/workflows/grade.yml
          echo 'CP1 create-from-scratch + real local modification contract is present.'
