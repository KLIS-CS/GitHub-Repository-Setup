name: CP1 Assessment Self-Test

on:
  push:
    branches: [main]
    paths:
      - 'README.md'
      - 'TEACHER-GRADING.md'
      - '.github/**'
      - 'tests/**'
  pull_request:
    branches: [main]
    paths:
      - 'README.md'
      - 'TEACHER-GRADING.md'
      - '.github/**'
      - 'tests/**'

permissions:
  contents: read

jobs:
  assessment-self-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate CP1 assessment structure
        shell: bash
        run: |
          set -euo pipefail
          for f in \
            README.md \
            TEACHER-GRADING.md \
            .github/ISSUE_TEMPLATE/cp1-submission.yml \
            .github/ISSUE_TEMPLATE/config.yml \
            .github/workflows/grade.yml \
            .github/scripts/cp1-utils.js \
            tests/cp1-utils.test.js; do
            test -f "$f" || { echo "Missing $f"; exit 1; }
          done

          grep -q 'cp1-repository-setup-YOUR-GITHUB-USERNAME' README.md
          grep -q 'Practice Repository URL' .github/ISSUE_TEMPLATE/cp1-submission.yml
          grep -q 'issues:' .github/workflows/grade.yml
          grep -q '/manual-grade' .github/workflows/grade.yml
          grep -q 'Teacher grading' .github/workflows/grade.yml
          grep -q 'README: 0/10' .github/workflows/grade.yml
          grep -q '.gitignore: 0/10' .github/workflows/grade.yml
          grep -q 'LICENSE: 0/10' .github/workflows/grade.yml
          grep -q 'Reasoning: 0/10' .github/workflows/grade.yml
          grep -q '60 automatic' TEACHER-GRADING.md
          grep -q 'fixed template' TEACHER-GRADING.md

      - name: Run grader fixture tests
        run: node tests/cp1-utils.test.js

      - name: Confirm old branch-based CP1 design is gone
        shell: bash
        run: |
          set -euo pipefail
          if grep -q 'cp1-YOUR-GITHUB-USERNAME' README.md; then
            echo 'Old CP1 branch convention is still present.'
            exit 1
          fi
          if grep -q 'project/README.md' README.md; then
            echo 'Old nested project/ assessment design is still present.'
            exit 1
          fi
          echo 'CP1 now tests repository setup directly.'
