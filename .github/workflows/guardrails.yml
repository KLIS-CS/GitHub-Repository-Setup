name: Checkpoint 1 — Guardrails

on:
  pull_request_target:
    types: [opened, reopened, synchronize, edited]
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  guardrails:
    runs-on: ubuntu-latest
    steps:
      - name: Validate checkpoint boundaries
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const pr = context.payload.pull_request;
            const expected = `cp1-${pr.user.login}`;
            const errors = [];

            if (pr.head.ref !== expected) errors.push(`Branch must be ${expected}, not ${pr.head.ref}.`);

            const files = await github.paginate(github.rest.pulls.listFiles, {owner, repo, pull_number:pr.number, per_page:100});
            const allowed = [/^submission\.md$/, /^project\/(README\.md|\.gitignore|LICENSE)$/];
            const invalid = files.map(f=>f.filename).filter(path => !allowed.some(r=>r.test(path)));
            if (invalid.length) errors.push(`Files outside CP1 scope: ${invalid.join(', ')}`);

            try {
              const r = await github.rest.repos.getContent({owner, repo, path:'submission.md', ref:pr.head.ref});
              const text = Buffer.from(r.data.content, r.data.encoding).toString('utf8');
              const stated = text.match(/^GitHub Username:\s*@?(\S+)/mi)?.[1];
              if (stated && stated.toLowerCase() !== pr.user.login.toLowerCase()) errors.push(`GitHub Username must match PR author @${pr.user.login}.`);
            } catch (e) { if (e.status !== 404) throw e; }

            if (errors.length) core.setFailed(errors.join('\n'));
            else core.info('CP1 guardrails passed.');
