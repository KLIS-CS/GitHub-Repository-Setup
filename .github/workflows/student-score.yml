name: CP1 — Student Score

on:
  push:
    branches: [main]
    paths:
      - 'README.md'
      - '.gitignore'
      - 'LICENSE'
      - 'LICENSE.md'
      - 'LICENSE.txt'
      - '.github/workflows/student-score.yml'
      - '.github/scripts/cp1-utils.js'
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: read
  issues: write

jobs:
  score:
    if: ${{ github.repository != 'KLIS-CS/GitHub-Repository-Setup' }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Calculate score in Exercise Issue
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const { evaluateRepository } = require('./.github/scripts/cp1-utils');
            const { owner, repo } = context.repo;
            const exerciseMarker = '<!-- klis-cp1-exercise -->';
            const scoreMarker = '<!-- klis-cp1-local-score -->';
            const teacherStart = '<!-- klis-cp1-teacher-sync-start -->';
            const teacherEnd = '<!-- klis-cp1-teacher-sync-end -->';

            const read = path => fs.existsSync(path) ? fs.readFileSync(path, 'utf8') : '';
            const readmePresent = fs.existsSync('README.md');
            const gitignorePresent = fs.existsSync('.gitignore');
            const licenseCandidates = ['LICENSE', 'LICENSE.md', 'LICENSE.txt'];
            const licensePath = licenseCandidates.find(path => fs.existsSync(path)) || 'LICENSE';
            const licensePresent = licenseCandidates.some(path => fs.existsSync(path));
            const { data: meta } = await github.rest.repos.get({ owner, repo });

            const result = evaluateRepository({
              meta,
              readme: read('README.md'),
              gitignore: read('.gitignore'),
              license: licensePresent ? read(licensePath) : '',
              readmePresent, gitignorePresent, licensePresent, licensePath,
              student: owner
            });

            let teacher = null, grader = null, feedback = '', teacherUpdatedAt = null;
            const gradeUrl = `https://raw.githubusercontent.com/KLIS-CS/GitHub-Repository-Setup/grades/.cp1-grades/${encodeURIComponent(owner.toLowerCase())}.json?ts=${Date.now()}`;
            const gradeResponse = await fetch(gradeUrl, { headers: { 'User-Agent': 'KLIS-CS-CP1-Student-Score' } });
            if (gradeResponse.ok) {
              const grade = await gradeResponse.json();
              if (Number.isInteger(grade.teacherScore)) teacher = grade.teacherScore;
              grader = grade.grader || null;
              feedback = grade.feedback || '';
              teacherUpdatedAt = grade.updatedAt || null;
            } else if (gradeResponse.status !== 404) {
              core.warning(`Teacher grade sync returned HTTP ${gradeResponse.status}.`);
            }

            const total = result.automatic + (teacher ?? 0);
            const rows = result.checks.map(([label, earned, max, detail]) =>
              `| ${earned === max ? '✅' : earned ? '🟨' : '⬜'} ${label} | ${earned}/${max} | ${detail} |`
            ).join('\n');

            const status = result.automatic < 60
              ? '🟡 **IN PROGRESS — complete the missing repository requirements.**'
              : teacher === null
                ? '🔵 **AUTOMATIC CHECKS PASSED — ready for teacher review.**'
                : `✅ **FINAL SCORE: ${total}/100**`;

            const feedbackBlock = teacher === null
              ? 'Teacher feedback will appear here after grading in the mother repository.'
              : feedback ? `> ${feedback.replace(/\n/g, '\n> ')}` : '> Teacher grade published. No written feedback was included.';

            const body = `${scoreMarker}
            ## CP1 — Progress & Score

            **Repository:** https://github.com/${owner}/${repo}  
            **Automatic score:** ${result.automatic}/60

            | Check | Score | Evidence |
            |---|---:|---|
            ${rows}

            ${status}

            **If a row is incomplete, fix the corresponding file on \`main\`. This same table updates automatically.**

            ## Submit for teacher review

            [Submit CP1 to the mother repository](https://github.com/KLIS-CS/GitHub-Repository-Setup/issues/new?template=cp1-submission.yml)

            ${teacherStart}
            ### 🧑‍🏫 Teacher review

            **Teacher score:** ${teacher === null ? 'awaiting review' : `${teacher}/40${grader ? ` by @${grader}` : ''}`}  
            **Final score:** ${teacher === null ? 'pending teacher review' : `${total}/100`}

            #### Teacher feedback
            ${feedbackBlock}
            ${teacherUpdatedAt ? `\n_Last synced: ${teacherUpdatedAt}_` : ''}
            ${teacherEnd}
            `;

            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: 'all', per_page: 100
            });
            let exercise = issues.find(i => !i.pull_request && i.body?.includes(exerciseMarker));
            if (!exercise) {
              exercise = (await github.rest.issues.create({
                owner, repo,
                title: 'Exercise: Checkpoint 1 — Repository Setup',
                body: `${exerciseMarker}\n## Checkpoint 1 — Repository Setup`
              })).data;
            }

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number: exercise.number, per_page: 100
            });
            const existing = comments.find(c => c.user?.login === 'github-actions[bot]' && c.body?.includes(scoreMarker));

            if (existing) await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            else await github.rest.issues.createComment({ owner, repo, issue_number: exercise.number, body });

            await core.summary
              .addHeading(`CP1: ${teacher === null ? `${result.automatic}/60 automatic` : `${total}/100`}`)
              .write();
