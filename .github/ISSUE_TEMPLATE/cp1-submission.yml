name: CP1 Submission — Repository Setup
description: Submit the public CP1 repository you created yourself and then modified locally.
title: "[CP1] Repository Setup Submission"
body:
  - type: markdown
    attributes:
      value: |
        ## Checkpoint 1 — Repository Setup

        Complete your CP1 repository first, then submit it here. The automatic grader will inspect the public repository and post your score in this Issue.

        Required repository name:

        `cp1-repository-setup-YOUR-GITHUB-USERNAME`

        Your repository must be **public**, owned by you, created manually from GitHub's **New repository** flow, and must not be a fork or template copy. It must also show evidence that you modified it after creation.

  - type: input
    id: repository_url
    attributes:
      label: Practice Repository URL
      description: Paste the full GitHub URL of your public CP1 repository. Paste the repository URL, not a README or file URL.
      placeholder: https://github.com/YOUR-USERNAME/cp1-repository-setup-YOUR-USERNAME
    validations:
      required: true

  - type: input
    id: github_username
    attributes:
      label: GitHub Username
      description: Enter the GitHub username that owns the CP1 repository.
      placeholder: octocat
    validations:
      required: true

  - type: textarea
    id: readme_reason
    attributes:
      label: README Explanation
      description: What is the purpose of a README, and what information did you add when you modified yours?
      placeholder: Explain in 2–4 sentences.
    validations:
      required: true

  - type: textarea
    id: gitignore_reason
    attributes:
      label: .gitignore Explanation
      description: Which files or folders did you ignore, and why should they not be committed?
      placeholder: Explain in 2–4 sentences.
    validations:
      required: true

  - type: textarea
    id: license_reason
    attributes:
      label: LICENSE Explanation
      description: Which license did you choose, and what does that license communicate to other people who may use your code?
      placeholder: Explain in 2–4 sentences.
    validations:
      required: true

  - type: textarea
    id: reflection
    attributes:
      label: Reflection
      description: What was different about creating the repository versus modifying it after cloning, and which part required more judgment?
      placeholder: Explain in 2–4 sentences.
    validations:
      required: true

  - type: checkboxes
    id: integrity
    attributes:
      label: Integrity Check
      options:
        - label: I created this repository manually with GitHub New repository; I did not use a template or fork.
          required: true
        - label: I cloned the repository and made a later modification commit after the initial repository-creation commit.
          required: true
        - label: I created my own README, .gitignore, and LICENSE choices.
          required: true
        - label: I did not include passwords, API keys, tokens, or other secrets in the repository.
          required: true
