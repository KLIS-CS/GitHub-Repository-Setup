name: CP1 Submission — Repository Setup
description: Submit your public CP1 repository for automatic and teacher review.
title: "[CP1] Repository Setup Submission"
body:
  - type: markdown
    attributes:
      value: |
        ## Checkpoint 1 — Repository Setup

        Complete your CP1 repository first, then submit it here.

        Required repository name:

        `cp1-repository-setup-YOUR-GITHUB-USERNAME`

        Your repository must be **public**, owned by you, and created by you with **GitHub → New repository**. Do not fork another repository and do not use **Use this template**.

        CP1 uses the default `main` branch only. No feature branch or Pull Request is required.

        Your finished repository must contain `README.md`, `.gitignore`, and `LICENSE` at the repository root. The teacher will see direct links and previews of all three files in this submission Issue.

  - type: input
    id: repository_url
    attributes:
      label: Practice Repository URL
      description: Paste the full GitHub URL of your public CP1 repository. Paste the repository URL, not a README or file URL.
      placeholder: https://github.com/YOUR-USERNAME/cp1-repository-setup-YOUR-USERNAME
    validations:
      required: true

  - type: input
    id: github_username
    attributes:
      label: GitHub Username
      description: Enter the GitHub username that owns the CP1 repository.
      placeholder: octocat
    validations:
      required: true

  - type: textarea
    id: readme_reason
    attributes:
      label: README Explanation
      description: What is the purpose of a README, and what information did you include in yours?
      placeholder: Explain in 2–4 sentences.
    validations:
      required: true

  - type: textarea
    id: gitignore_reason
    attributes:
      label: .gitignore Explanation
      description: Which files or folders did you ignore, and why should they not be committed?
      placeholder: Explain in 2–4 sentences.
    validations:
      required: true

  - type: textarea
    id: license_reason
    attributes:
      label: LICENSE Explanation
      description: Which license did you choose, and what does that license communicate to other people who may use your code?
      placeholder: Explain in 2–4 sentences.
    validations:
      required: true

  - type: textarea
    id: reflection
    attributes:
      label: Reflection
      description: Which repository-setup decision required the most judgment, and why?
      placeholder: Explain in 2–4 sentences.
    validations:
      required: true

  - type: checkboxes
    id: integrity
    attributes:
      label: Integrity Check
      options:
        - label: I created this repository myself with GitHub → New repository; I did not fork or use a template.
          required: true
        - label: My finished README.md, .gitignore, and LICENSE are all visible on main.
          required: true
        - label: I did not include passwords, API keys, tokens, or other secrets in the repository.
          required: true
