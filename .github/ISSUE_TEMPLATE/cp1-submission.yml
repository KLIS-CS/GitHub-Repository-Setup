name: CP1 Submission — Repository Setup
description: Submit the public CP1 repository you completed from the official KLIS-CS template.
title: "[CP1] Repository Setup Submission"
body:
  - type: markdown
    attributes:
      value: |
        ## Checkpoint 1 — Repository Setup

        Complete your CP1 repository first, then submit it here. The automatic grader will inspect the public repository and post your score in this Issue.

        Required repository name:

        `cp1-repository-setup-YOUR-GITHUB-USERNAME`

        Your repository must be **public**, owned by you, and must not be a fork or a copy of an unrelated template. The normal CP1 flow uses the official `KLIS-CS/GitHub-Repository-Setup` template.

  - type: input
    id: repository_url
    attributes:
      label: Practice Repository URL
      description: Paste the full GitHub URL of your public CP1 repository. Paste the repository URL, not a README or file URL.
      placeholder: https://github.com/YOUR-USERNAME/cp1-repository-setup-YOUR-USERNAME
    validations:
      required: true

  - type: input
    id: github_username
    attributes:
      label: GitHub Username
      description: Enter the GitHub username that owns the CP1 repository.
      placeholder: octocat
    validations:
      required: true

  - type: textarea
    id: readme_reason
    attributes:
      label: README Explanation
      description: What is the purpose of a README, and what information did you include in yours?
      placeholder: Explain in 2–4 sentences.
    validations:
      required: true

  - type: textarea
    id: gitignore_reason
    attributes:
      label: .gitignore Explanation
      description: Which files or folders did you ignore, and why should they not be committed?
      placeholder: Explain in 2–4 sentences.
    validations:
      required: true

  - type: textarea
    id: license_reason
    attributes:
      label: LICENSE Explanation
      description: Which license did you choose, and what does that license communicate to other people who may use your code?
      placeholder: Explain in 2–4 sentences.
    validations:
      required: true

  - type: textarea
    id: reflection
    attributes:
      label: Reflection
      description: Which repository-setup decision required the most judgment, and why?
      placeholder: Explain in 2–4 sentences.
    validations:
      required: true

  - type: checkboxes
    id: integrity
    attributes:
      label: Integrity Check
      options:
        - label: I did not fork another repository or use an unrelated template for this CP1 submission.
          required: true
        - label: I replaced the starter README and created my own .gitignore and LICENSE choices.
          required: true
        - label: I did not include passwords, API keys, tokens, or other secrets in the repository.
          required: true
